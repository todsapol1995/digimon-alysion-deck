# Rebuilds the site every hour: pulls fresh cards + community decks from alysioncards.com
# (node sync.mjs) and publishes public/ + data/ to GitHub Pages.
# Also runs on every push to main (e.g. collection saved from the website, new recommended decks)
# and on demand (↻ button on the website in edit mode, or "Run workflow" in the Actions tab).
# Synced files (cards/decks) are NOT committed — they only go into the published site, so the repo history stays small.
name: Sync & deploy

on:
  schedule:
    - cron: "17 * * * *" # every hour (UTC); GitHub may delay scheduled runs a little
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync from alysioncards.com
        run: node sync.mjs
      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r public/. _site/
          cp data/*.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
